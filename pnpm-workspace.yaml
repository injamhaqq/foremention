allowBuilds:
  core-js: false
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  workerd: true
overrides:
  sharp: 0.35.5
  postcss: 8.5.23
  # Reject unbounded indexed-source-map offsets (CVE-2026-93749).
  source-map-js@<=1.2.1: 1.2.2
  # Refresh the reviewed security patches; keep scanner gates enabled.
  '@grpc/grpc-js@>=1.14.0 <1.14.5': 1.14.5
  brace-expansion@>=1.0.0 <1.1.21: 1.1.21
  brace-expansion@2.1.3: 5.0.12
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
  dompurify@<=3.4.16: ^3.4.17
  js-yaml@>=4.0.0 <4.3.2: 4.3.2
  nanoid@<3.3.17: ^3.3.17
  undici@>=7.0.0 <7.30.1: ^7.30.1
  fast-uri@>=3.0.0 <3.1.9: 3.1.9
  # Satori-generated SVG improper escaping (dev-only, via @vercel/og).
  satori@<0.33.5: ^0.33.5
  # fflate infinite loop on malformed ZIP64; scoped so posthog-js (0.4.9) is untouched.
  fflate@>=0.7.0 <0.7.5: ^0.7.5
  # Transitive production advisories: prototype pollution and command injection.
  systeminformation@<5.33.16: ^5.33.16
  # Zod memory exhaustion while validating oversized constrained strings.
  zod@<4.6.6: ^4.6.6
  # Patched JXL/HEIF and ICNS parser DoS (two published OSV advisories).
  image-size: 2.0.4
  # Downstream dependency-chain fork: fast-glob consumers resolve micromatch through a repository-owned fork.
  micromatch: file:vendor/micromatch
onlyBuiltDependencies:
  - esbuild
  - protobufjs
  - sharp
  - unrs-resolver
  - workerd
minimumReleaseAgeExclude:
  - vite@8.0.16
  - next@16.3.8
  - '@grpc/grpc-js@1.14.5'
  - brace-expansion@1.1.21 || 5.0.12
  - undici@7.30.1
  - js-yaml@4.3.2
  - dompurify@3.4.17
  - nanoid@3.3.17
  - fast-uri@3.1.8
  - zod@4.6.6
  - systeminformation@5.33.16
  - next@16.4.1
