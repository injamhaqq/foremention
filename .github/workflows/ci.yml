name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # current v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # current v6
        with:
          version: 10.25.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # current v7.0.0
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check production dependency advisories
        run: pnpm audit --prod --audit-level=moderate

      - name: Check patch hygiene
        run: git diff --check HEAD^
        if: github.event_name == 'push'

      - name: Check pull request patch hygiene
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "${BASE_SHA}...HEAD"

      - name: Run tests
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Cloudflare Worker dry run
        run: pnpm exec wrangler deploy --dry-run --config dist/server/wrangler.json --outdir .wrangler-dry-run

      - name: Generate release SBOM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: foremention-sbom.spdx.json
          upload-artifact: false

      - name: Archive verified build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foremention-dist-${{ github.sha }}
          path: |
            dist
            foremention-sbom.spdx.json
          if-no-files-found: error
          retention-days: 1

      - name: Verify exact Cloudflare production release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FOREMENTION_BASE_URL: https://foremention.com
          FOREMENTION_EXPECTED_BUILD_COMMIT: ${{ github.sha }}
          FOREMENTION_RELEASE_WAIT_SECONDS: '300'
        run: node scripts/production-auth-smoke.mjs

      - name: Sync live Inngest functions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FOREMENTION_BASE_URL: https://foremention.com
          FOREMENTION_EXPECTED_BUILD_COMMIT: ${{ github.sha }}
        run: node scripts/production-inngest-sync.mjs

      - name: Probe live Inngest execution
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FOREMENTION_BASE_URL: https://foremention.com
          FOREMENTION_EXPECTED_BUILD_COMMIT: ${{ github.sha }}
          FOREMENTION_INNGEST_WAIT_SECONDS: '90'
        run: node scripts/production-inngest-smoke.mjs

  attest-release:
    name: Attest verified release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Download verified build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: foremention-dist-${{ github.sha }}
          path: verified-release

      - name: Create deterministic release bundle
        shell: bash
        run: |
          set -euo pipefail
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf "foremention-release-${GITHUB_SHA}.tar.gz" -C verified-release dist

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: foremention-release-${{ github.sha }}.tar.gz

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: foremention-release-${{ github.sha }}.tar.gz
          sbom-path: verified-release/foremention-sbom.spdx.json
