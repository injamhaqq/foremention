name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check production dependency advisories
        run: pnpm audit --prod --audit-level=moderate

      - name: Run tests
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Cloudflare Worker dry run
        run: pnpm exec wrangler deploy --dry-run --config dist/server/wrangler.json --outdir .wrangler-dry-run

      - name: Archive verified build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: foremention-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 1

      - name: Verify exact Cloudflare production release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FOREMENTION_BASE_URL: https://foremention.com
          FOREMENTION_EXPECTED_BUILD_COMMIT: ${{ github.sha }}
          FOREMENTION_RELEASE_WAIT_SECONDS: '300'
        run: node scripts/production-auth-smoke.mjs

      - name: Sync live Inngest functions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FOREMENTION_BASE_URL: https://foremention.com
          FOREMENTION_EXPECTED_BUILD_COMMIT: ${{ github.sha }}
        run: node scripts/production-inngest-sync.mjs

      - name: Probe live Inngest execution
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FOREMENTION_BASE_URL: https://foremention.com
          FOREMENTION_EXPECTED_BUILD_COMMIT: ${{ github.sha }}
          FOREMENTION_INNGEST_WAIT_SECONDS: '90'
        run: node scripts/production-inngest-smoke.mjs
