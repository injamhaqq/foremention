name: Acquisition Shadow Run

on:
  # The workflow's first merge to main performs one bounded real shadow run.
  # Future executions are manual and require the explicit RUN confirmation.
  push:
    branches:
      - main
    paths:
      - '.github/workflows/acquisition-shadow-run.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RUN to invoke the bounded production acquisition shadow function'
        required: true
        default: 'NO'
        type: string

permissions:
  contents: read

concurrency:
  group: acquisition-shadow-production
  cancel-in-progress: false

jobs:
  invoke-shadow:
    name: Invoke bounded acquisition shadow
    if: github.event_name == 'push' || inputs.confirm == 'RUN'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # current v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # current v7.0.0
        with:
          node-version: 22.13.0

      - name: Invoke production shadow function
        env:
          INNGEST_AUTH_TOKEN: ${{ secrets.INNGEST_API_KEY || secrets.INNGEST_SIGNING_KEY }}
          FOREMENTION_EXPECTED_BUILD_COMMIT: ${{ github.sha }}
          ACQUISITION_SHADOW_CONFIRM: ${{ github.event_name == 'push' && 'RUN' || inputs.confirm }}
        run: node scripts/invoke-acquisition-shadow.mjs
