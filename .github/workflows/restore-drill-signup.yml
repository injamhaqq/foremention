name: Restore Drill Signup

on:
  push:
    branches:
      - ops/restore-drill-20260814

permissions:
  contents: read

jobs:
  signup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create disposable restore-drill account
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base='https://foremention.com';
          const email='foremention2026+restore-20260814-0553@gmail.com';
          const password='R8!vZ4#pM7@kQ2$wT9^cN5&xL3';
          const response=await fetch(`${base}/api/auth/signup`,{
            method:'POST',
            headers:{'content-type':'application/json','accept':'application/json'},
            body:JSON.stringify({email,password,confirmation:password,full_name:'Foremention Restore Drill'})
          });
          const body=await response.text();
          let parsed=null; try { parsed=JSON.parse(body); } catch {}
          const safeError=String(parsed?.error || parsed?.message || '').slice(0,240);
          console.log('RESTORE_DRILL_SIGNUP',JSON.stringify({email,status:response.status,ok:parsed?.ok===true,session:parsed?.session===true,error:safeError}));
          if(response.status!==200 || parsed?.ok!==true) throw new Error(`Signup failed HTTP ${response.status}: ${safeError}`);
          NODE
