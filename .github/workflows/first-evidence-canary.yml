name: Authenticated First-Evidence Canary

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: first-evidence-canary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  production-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.13.0

      - name: Verify exact production release before canary
        env:
          FOREMENTION_BASE_URL: https://foremention.com
          FOREMENTION_EXPECTED_BUILD_COMMIT: ${{ github.sha }}
          FOREMENTION_RELEASE_WAIT_SECONDS: '300'
        run: node scripts/production-auth-smoke.mjs

      - name: Install pinned Chromium canary tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-tools
          cat > .ci-tools/package.json <<'JSON'
          {
            "private": true,
            "dependencies": {
              "playwright": "1.60.0"
            }
          }
          JSON
          npm install --prefix .ci-tools --package-lock=false --ignore-scripts --no-audit --no-fund
          .ci-tools/node_modules/.bin/playwright install --with-deps chromium

      - name: Run authenticated first-evidence production canary
        env:
          FOREMENTION_BROWSER_BASE_URL: https://foremention.com
          FOREMENTION_EXPECTED_BUILD_COMMIT: ${{ github.sha }}
          FOREMENTION_ACCEPTANCE_EMAIL: ${{ secrets.FOREMENTION_ACCEPTANCE_EMAIL }}
          FOREMENTION_ACCEPTANCE_PASSWORD: ${{ secrets.FOREMENTION_ACCEPTANCE_PASSWORD }}
          FOREMENTION_ACCEPTANCE_CANARY_ENABLED: ${{ secrets.FOREMENTION_ACCEPTANCE_CANARY_ENABLED }}
          # Free-only production canary: grounded Cloudflare Workers AI + Bing Search RSS is fixed by policy.
          # The legacy approval flag remains true so the canary executes its real-provider path;
          # this is not authorization to purchase or upgrade provider billing.
          FOREMENTION_ACCEPTANCE_PROVIDER_SPEND_APPROVED: 'true'
          FOREMENTION_ACCEPTANCE_PROVIDER: 'cloudflare'
          FOREMENTION_ACCEPTANCE_EXPECTED_MODEL: '@cf/google/gemma-4-26b-a4b-it'
          FOREMENTION_ACCEPTANCE_MAX_COST_USD: '0.01'
          FOREMENTION_ACCEPTANCE_CANARY_REQUIRED: 'true'
          FOREMENTION_ACCEPTANCE_CANARY_TIMEOUT_MS: '1200000'
        run: node scripts/first-evidence-production-canary.mjs

      - name: Archive first-evidence canary evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foremention-first-evidence-canary-${{ github.sha }}
          path: browser-acceptance/first-evidence-production-canary.json
          if-no-files-found: error
          retention-days: 5
