name: Repair outreach lockfile

on:
  push:
    branches:
      - build/outreach-ready-public-site-20260903

permissions:
  contents: write

concurrency:
  group: repair-outreach-lock
  cancel-in-progress: true

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # current v6
        with:
          ref: build/outreach-ready-public-site-20260903
          fetch-depth: 0
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # current v6
        with:
          version: 10.25.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # current v6
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Apply minimal patched fast-uri lock delta
        shell: bash
        env:
          BASE_SHA: 40010b6d5bcaca0a445fd40ff3f038a367944421
        run: |
          set -euo pipefail
          git show "${BASE_SHA}:pnpm-lock.yaml" > pnpm-lock.yaml
          python - <<'PY'
          from pathlib import Path

          path = Path("pnpm-lock.yaml")
          text = path.read_text()
          replacements = [
              (
                  "  undici@>=7.0.0 <7.29.0: ^7.29.0\n\nimporters:",
                  "  undici@>=7.0.0 <7.29.0: ^7.29.0\n  fast-uri@>=3.0.0 <3.1.6: 3.1.6\n\nimporters:",
              ),
              (
                  "  fast-uri@3.1.5:\n    resolution: {integrity: sha512-gHwA1O9LDIcKunMKhObS/HimwtehO1nPUECKAu5TpKgaO19fcWEl4bliWe1jWxVFvIXztJjjQ4L8XQ1EU9f7Jw==}",
                  "  fast-uri@3.1.6:\n    resolution: {integrity: sha512-7Ical1vFEMr0onbVzEDIreM22I4khW+fzyQPwvAFWBp1iwdshSZRsL4jjRvPG9JP1uiqMHRto+YU6R2/CzDz5Q==}",
              ),
              ("      fast-uri: 3.1.5\n", "      fast-uri: 3.1.6\n"),
              ("  fast-uri@3.1.5: {}\n", "  fast-uri@3.1.6: {}\n"),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one lock occurrence, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)
          if "fast-uri@3.1.5" in text or "fast-uri: 3.1.5" in text:
              raise SystemExit("Vulnerable fast-uri 3.1.5 remains in lockfile")
          path.write_text(text)
          PY

      - name: Prove lockfile is frozen-install compatible
        run: pnpm install --lockfile-only --frozen-lockfile

      - name: Commit only the minimal lockfile repair when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Minimal lockfile repair already present."
            exit 0
          fi
          changed="$(git diff --name-only)"
          if [ "$changed" != "pnpm-lock.yaml" ]; then
            echo "Unexpected generated files:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
          git diff --check -- pnpm-lock.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix: keep fast-uri lock repair minimal"
          git push origin HEAD:build/outreach-ready-public-site-20260903
