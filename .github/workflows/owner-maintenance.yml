name: owner-maintenance

# Manually dispatched owner maintenance (audit A06 + A16).
# Requires repository secret HARK_ADMIN_TOKEN: fine-grained PAT scoped to this
# repo with Secrets (RW) and Administration (RW). Delete the secret afterwards.
on:
  workflow_dispatch:
    inputs:
      rotate_acceptance_password:
        description: Rotate FOREMENTION_ACCEPTANCE_PASSWORD (uploads bcrypt hash only)
        type: boolean
        default: true
      update_ruleset:
        description: Add required security checks to ruleset "main protection"
        type: boolean
        default: true
      cleanup_admin_token:
        description: Delete HARK_ADMIN_TOKEN and revoke the PAT (run last)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: owner-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.HARK_ADMIN_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Check token
        run: |
          if [ -z "${GH_TOKEN}" ]; then echo "HARK_ADMIN_TOKEN is not set" >&2; exit 1; fi

      - name: Rotate acceptance password secret
        if: ${{ inputs.rotate_acceptance_password }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet bcrypt==4.2.0
          PW="$(python3 -c 'import secrets;print(secrets.token_urlsafe(30))')"
          echo "::add-mask::${PW}"
          printf '%s' "${PW}" | python3 -c 'import bcrypt,sys;print(bcrypt.hashpw(sys.stdin.read().encode(),bcrypt.gensalt(rounds=10,prefix=b"2a")).decode())' > acceptance-password-hash.txt
          printf '%s' "${PW}" | gh secret set FOREMENTION_ACCEPTANCE_PASSWORD --repo "${REPO}"
          unset PW
          echo "Secret updated; bcrypt hash written for the Supabase side."

      - name: Upload bcrypt hash (not the password)
        if: ${{ inputs.rotate_acceptance_password }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-password-hash
          path: acceptance-password-hash.txt
          retention-days: 1

      - name: Add required checks to ruleset
        if: ${{ inputs.update_ruleset }}
        run: |
          set -euo pipefail
          RID=20223161
          gh api "repos/${REPO}/rulesets/${RID}" > ruleset.json
          jq '{name, target, enforcement, conditions, bypass_actors,
               rules: (.rules | map(
                 if .type == "required_status_checks" then
                   .parameters.required_status_checks |= (
                     (. + ([
                       "secrets","trivy","osv","actions-security","dependency-review",
                       "Analyze JavaScript and TypeScript","browser-acceptance"
                     ] | map({context: .}))) | unique_by(.context))
                 else . end))}' ruleset.json > ruleset-new.json
          gh api -X PUT "repos/${REPO}/rulesets/${RID}" --input ruleset-new.json \
            | jq -r '.rules[] | select(.type=="required_status_checks") | .parameters.required_status_checks[].context'

      - name: Delete HARK_ADMIN_TOKEN and revoke the PAT
        if: ${{ inputs.cleanup_admin_token }}
        run: |
          set -euo pipefail
          gh secret delete HARK_ADMIN_TOKEN --repo "${REPO}"
          jq -n --arg t "${GH_TOKEN}" '{credentials: [$t]}' \
            | curl -fsS -X POST -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                https://api.github.com/credentials/revoke --data @- -o /dev/null -w "revoke HTTP %{http_code}\n"
