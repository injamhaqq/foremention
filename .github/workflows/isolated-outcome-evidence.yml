name: Isolated Outcome Evidence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-outcome-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scoped-evidence:
    name: Signed-in RLS and exact-context parity
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.13.0

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.111.0

      - name: Exercise disposable local Auth, tenant RLS, and persisted parity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cleanup() {
            rm -f .isolated-local-env .dev.vars .local-cli-status .isolated-supabase-start.log
            supabase stop --no-backup >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # The only credentials used are generated by the disposable local
          # Supabase CLI for this run; never use prod secrets or print env files.
          supabase start > .isolated-supabase-start.log 2>&1
          supabase db reset >> .isolated-supabase-start.log 2>&1
          supabase status -o env > .local-cli-status
          node scripts/prepare-isolated-local-env.mjs .local-cli-status
          set -a
          source .isolated-local-env
          set +a

          node --experimental-strip-types scripts/verify-isolated-outcome-context-auth.mjs

      - name: Assert local test secrets were removed
        if: always()
        shell: bash
        run: |
          for path in .isolated-local-env .dev.vars .local-cli-status .isolated-supabase-start.log; do
            if [ -e "$path" ]; then
              echo "Ephemeral local-auth test file was not removed: $path"
              exit 1
            fi
          done
