name: AI Safety and Code Health

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.25.0

      - name: Setup isolated quality Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install application dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned quality tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .quality-tools quality-results
          cat > .quality-tools/package.json <<'JSON'
          {
            "private": true,
            "dependencies": {
              "knip": "6.32.2",
              "promptfoo": "0.122.0"
            }
          }
          JSON
          npm install --prefix .quality-tools --package-lock=false --ignore-scripts --no-audit --no-fund

      - name: Run zero-cost Foremention safety evals
        env:
          PROMPTFOO_DISABLE_TELEMETRY: '1'
          PROMPTFOO_DISABLE_UPDATE: '1'
          PROMPTFOO_DISABLE_REMOTE_GENERATION: 'true'
          PROMPTFOO_DISABLE_REDTEAM_REMOTE_GENERATION: 'true'
        run: .quality-tools/node_modules/.bin/promptfoo eval -c evals/promptfooconfig.yaml --no-cache -o quality-results/promptfoo.json

      - name: Audit unused code and dependencies with Knip
        shell: bash
        run: |
          set -euo pipefail
          set +e
          .quality-tools/node_modules/.bin/knip --reporter json > quality-results/knip.json 2> quality-results/knip.stderr.txt
          knip_status=$?
          set -e
          node scripts/validate-knip-audit.mjs quality-results/knip.json "$knip_status" quality-results/knip-summary.json

      - name: Archive quality evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foremention-quality-${{ github.sha }}
          path: quality-results
          if-no-files-found: warn
          retention-days: 5
