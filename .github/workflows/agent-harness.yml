name: Agent Harness

on:
  pull_request:
    paths:
      - "CLAUDE.md"
      - ".mcp.json"
      - ".claude/**"
      - "tests/agent-harness-contract.test.mjs"
      - ".github/workflows/agent-harness.yml"
  push:
    branches:
      - main
    paths:
      - "CLAUDE.md"
      - ".mcp.json"
      - ".claude/**"
      - "tests/agent-harness-contract.test.mjs"
      - ".github/workflows/agent-harness.yml"

permissions:
  contents: read

jobs:
  validate-agent-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # current v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # current v7.0.0
        with:
          node-version: "22.13.0"
      - name: Validate agent harness contracts
        run: node --test tests/agent-harness-contract.test.mjs
