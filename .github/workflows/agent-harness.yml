name: Agent Harness

on:
  pull_request:
    paths:
      - "CLAUDE.md"
      - ".mcp.json"
      - ".claude/**"
      - "tests/agent-harness-contract.test.mjs"
      - ".github/workflows/agent-harness.yml"
  push:
    branches:
      - main
    paths:
      - "CLAUDE.md"
      - ".mcp.json"
      - ".claude/**"
      - "tests/agent-harness-contract.test.mjs"
      - ".github/workflows/agent-harness.yml"

permissions:
  contents: read

jobs:
  validate-agent-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Validate agent harness contracts
        run: node --test tests/agent-harness-contract.test.mjs
