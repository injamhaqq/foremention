name: Isolated Authenticated Journey

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-auth-journey-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-journey:
    name: Isolated Authenticated Journey
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.25.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.111.0

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Run complete authenticated journey against LOCAL Auth, PostgREST and Worker
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          server_pid=""
          cleanup() {
            if [ -n "$server_pid" ]; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
            rm -f .isolated-local-env .dev.vars dist/server/.dev.vars .local-cli-status .isolated-browser-server.log .isolated-supabase-start.log dist/server/wrangler.local-browser-bridge.json
            supabase stop --no-backup >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # All connected services run inside this disposable Actions runner.
          # Redirect local CLI output since it can contain generated test keys.
          supabase start > .isolated-supabase-start.log 2>&1
          supabase db reset >> .isolated-supabase-start.log 2>&1
          # Disposable integration only: test the permission state AFTER staged application rollout.
          docker exec -i supabase_db_foremention-mvp psql -v ON_ERROR_STOP=1 -U postgres -d postgres < scripts/release-gates/FM05-activate-question-history-privileges.sql >> .isolated-supabase-start.log 2>&1
          docker exec -i supabase_db_foremention-mvp psql -v ON_ERROR_STOP=1 -U postgres -d postgres < scripts/release-gates/FM05-activate-composite-project-fks.sql >> .isolated-supabase-start.log 2>&1
          supabase status -o env > .local-cli-status
          node scripts/prepare-isolated-local-env.mjs .local-cli-status
          set -a
          source .isolated-local-env
          set +a

          pnpm build
          cp .dev.vars dist/server/.dev.vars

          mkdir -p .ci-tools
          cat > .ci-tools/package.json <<'JSON'
          {
            "private": true,
            "dependencies": {
              "playwright": "1.60.0"
            }
          }
          JSON
          npm install --prefix .ci-tools --package-lock=false --ignore-scripts --no-audit --no-fund
          .ci-tools/node_modules/.bin/playwright install --with-deps chromium

          # Reuse the existing #358 direct compiled-Worker Chromium transport.
          # The same strict first-attempt customer API assertions remain intact.
          node scripts/isolated-compiled-worker-browser-bridge.mjs
          echo "Isolated authenticated acceptance succeeded without any external provider request."

      - name: Verify no test secrets or artifacts remain
        if: always()
        shell: bash
        run: |
          for path in .isolated-local-env .dev.vars dist/server/.dev.vars .local-cli-status dist/server/wrangler.local-browser-bridge.json; do
            if [ -e "$path" ]; then
              echo "Sensitive local test file was not cleaned: $path"
              exit 1
            fi
          done
