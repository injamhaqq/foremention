name: production-deploy

# Manual production deploy of the exact main commit to the foremention-mvp Worker.
# Workers Builds (git auto-deploy) has failed since a188082, and Hark's sandbox
# cannot upload static assets (asset-upload JWT is replaced by the injected API
# token). Requires repository secret CLOUDFLARE_API_TOKEN ("Edit Cloudflare
# Workers" template). Plain-text Worker vars set in the dashboard are kept
# (wrangler.jsonc keep_vars: true); secrets are never touched.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # current v6.1.0
        with:
          version: 10.25.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # current v7.1.0
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2981ae4b1efab57384de324d7e72f3bc
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then echo "CLOUDFLARE_API_TOKEN is not set" >&2; exit 1; fi
          npx --no-install wrangler deploy

      - name: Verify exact release
        run: |
          for _ in $(seq 1 12); do
            got="$(curl -fsS https://foremention.com/api/health | python3 -c 'import json,sys;print(json.load(sys.stdin).get("buildCommit",""))' || true)"
            if [ "${got}" = "${GITHUB_SHA}" ]; then echo "Production serves ${GITHUB_SHA}"; exit 0; fi
            sleep 10
          done
          echo "Production buildCommit ${got} != ${GITHUB_SHA}" >&2; exit 1
