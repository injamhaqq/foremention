name: Isolated Programmatic Worker

# Native HTTP full customer-review API suite, independent of the signed-in
# server-rendered UI proof in Isolated Outcome UI. No browser/dev proxy.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-programmatic-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-journey:
    name: Production-built local Workerd customer APIs

    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.25.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.111.0

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify programmatic compiled Worker customer journey and tenant isolation
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          server_pid=""
          cleanup() {
            if [ -n "$server_pid" ]; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
            rm -f .isolated-local-env .dev.vars dist/server/.dev.vars .local-cli-status .isolated-browser-server.log .isolated-supabase-start.log
            supabase stop --no-backup >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # All connected services run inside this disposable Actions runner.
          # Redirect local CLI output since it can contain generated test keys.
          supabase start > .isolated-supabase-start.log 2>&1
          supabase db reset >> .isolated-supabase-start.log 2>&1
          supabase status -o env > .local-cli-status
          node scripts/prepare-isolated-local-env.mjs .local-cli-status
          set -a
          source .isolated-local-env
          set +a

          # Exact-commit production Vinext/Cloudflare artifact only.
          # The official programmatic Wrangler test harness avoids the
          # intermittent wrangler dev HTTP proxy observed in issue #334.
          pnpm build
          cp .dev.vars dist/server/.dev.vars
          node scripts/isolated-programmatic-worker-harness.mjs
          echo "Programmatic workerd customer API acceptance passed without production/provider calls."

      - name: Verify no test secrets or artifacts remain
        if: always()
        shell: bash
        run: |
          for path in .isolated-local-env .dev.vars dist/server/.dev.vars .local-cli-status; do
            if [ -e "$path" ]; then
              echo "Sensitive local test file was not cleaned: $path"
              exit 1
            fi
          done
