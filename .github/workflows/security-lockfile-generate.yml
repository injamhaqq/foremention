name: Security lockfile generator

on:
  push:
    branches:
      - hardening/braces-vendored-remediation-20261003
    paths:
      - "vendor/braces/**"
      - "pnpm-workspace.yaml"
      - ".github/workflows/security-lockfile-generate.yml"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Generate reviewed lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify affected registry package is gone
        shell: bash
        run: |
          grep -q "file:vendor/braces" pnpm-lock.yaml
          if grep -q "braces@3.0.3" pnpm-lock.yaml; then
            echo "::error::Affected braces@3.0.3 registry resolution remains in pnpm-lock.yaml"
            exit 1
          fi

      - name: Verify generated lockfile installs
        run: pnpm install --frozen-lockfile

      - name: Commit generated lockfile and remove generator
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git rm .github/workflows/security-lockfile-generate.yml
          git commit -m "Regenerate lockfile for vendored braces remediation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
