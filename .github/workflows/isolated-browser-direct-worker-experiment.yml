name: Experimental Compiled-Worker Chromium Journey

# Independent issue #334 experiment; not a substitute for production staging
# or a default release gate until its first-attempt reliability is proven.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: experiment-compiled-chromium-${{ github.ref }}
  cancel-in-progress: true

jobs:
  direct-compiled-browser:
    name: Real Chromium over isolated direct compiled-Worker bridge
    runs-on: ubuntu-latest
    timeout-minutes: 43
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.25.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.111.0

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unchanged complete Chromium fixture against compiled Worker
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cleanup() {
            rm -f .isolated-local-env .dev.vars dist/server/.dev.vars \
              dist/server/wrangler.local-browser-bridge.json \
              .local-cli-status .isolated-supabase-start.log
            supabase stop --no-backup >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # Synthetic local users only, freshly replayed isolated database.
          # No production Auth secret, external search or model provider.
          supabase start > .isolated-supabase-start.log 2>&1
          supabase db reset >> .isolated-supabase-start.log 2>&1
          supabase status -o env > .local-cli-status
          node scripts/prepare-isolated-local-env.mjs .local-cli-status
          set -a
          source .isolated-local-env
          set +a

          pnpm build
          cp .dev.vars dist/server/.dev.vars

          # Same pinned Chromium version as existing manual full-browser
          # fixture. Only transport changes; acceptance assertions are intact.
          mkdir -p .ci-tools
          cat > .ci-tools/package.json <<'JSON'
          {
            "private": true,
            "dependencies": {
              "playwright": "1.60.0"
            }
          }
          JSON
          npm install --prefix .ci-tools --package-lock=false --ignore-scripts --no-audit --no-fund
          .ci-tools/node_modules/.bin/playwright install --with-deps chromium

          node scripts/isolated-compiled-worker-browser-bridge.mjs
          echo "Experimental real Chromium journey passed first attempt against compiled local Worker."

      - name: Assert synthetic keys and ephemeral proxy config were deleted
        if: always()
        shell: bash
        run: |
          for path in .isolated-local-env .dev.vars dist/server/.dev.vars \
            dist/server/wrangler.local-browser-bridge.json .local-cli-status; do
            if [ -e "$path" ]; then
              echo "Sensitive synthetic test file or ephemeral config was not cleaned."
              exit 1
            fi
          done
