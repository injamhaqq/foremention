name: Branch self-patch legacy detector removal

on:
  push:
    branches:
      - fix/remove-legacy-pre-review-change-detector-v2-20260815

permissions:
  contents: write

concurrency:
  group: branch-self-patch-remove-legacy-detector
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Remove only the dead pre-review movement detector
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/jobs/inngest.ts')
          text = path.read_text()

          block = re.compile(
              r'async function recordRunChanges\(run: RunRow, identity: Identity\) \{.*?\n\}\n\n(?=async function notifyFirstCompletedRun)',
              re.S,
          )
          text, block_count = block.subn('', text, count=1)
          if block_count != 1:
              raise SystemExit(f'Expected exactly one recordRunChanges block, removed {block_count}.')

          call = '    await step.run("detect-run-changes", () => recordRunChanges(run, identity));\n'
          if text.count(call) != 1:
              raise SystemExit(f'Expected exactly one detect-run-changes call, found {text.count(call)}.')
          text = text.replace(call, '', 1)

          forbidden = [
              'async function recordRunChanges',
              'detect-run-changes',
              'recordRunChanges(run, identity)',
              'across comparable scheduled runs',
              'between comparable runs',
              'competitor_overtook:',
          ]
          remaining = [value for value in forbidden if value in text]
          if remaining:
              raise SystemExit(f'Legacy detector markers remain: {remaining!r}')

          required = [
              'mark-run-for-human-review',
              'notify-run-owner',
              'email-first-run-owner',
              'run_ready',
              'first_run_completed',
              'schedule-weekly-workspace-runs',
              'cron: "0 8 * * 1"',
              'prepareWeeklyRun',
          ]
          missing = [value for value in required if value not in text]
          if missing:
              raise SystemExit(f'Required operational markers missing: {missing!r}')

          path.write_text(text)
          PY

          rm .github/workflows/branch-self-patch-remove-legacy-detector.yml
          git diff --check

      - name: Commit exact patch without force
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --exit-code && { echo 'No patch produced.' >&2; exit 1; } || true
          git commit -m 'Remove legacy pre-review movement detector'
          git push origin HEAD:fix/remove-legacy-pre-review-change-detector-v2-20260815
